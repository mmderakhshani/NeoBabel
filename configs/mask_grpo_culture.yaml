wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "neobabel-mask-grpo"
    name: "mask-grpo-culture"
    output_dir: "mask-grpo-culture"
    save_every: 100
    max_train_examples_t2i: 40000000

model:
    vq_model:
        type: "magvitv2"
        vq_model_name: "showlab/magvitv2"
    neobabel:
        load_from_neobabel: False
        pretrained_model_path: "Dheerraa/NeoBabel"  # or local checkpoint dir
        vocab_size: 264203
        llm_vocab_size: 256000
        llm_model_path: 'google/gemma-2-2b-it'
        codebook_size: 8192
        num_vq_tokens: 1024
        num_new_special_tokens: 10
    gradient_checkpointing: True

dataset:
    params:
        # built by training/build_culture_grpo_prompts.py from geocult.json:
        # 6,000 multilingual cultural prompts (1,000 uuids x 6 languages),
        # each carrying its parallel English caption as reward_prompt
        grpo_prompts_file: "culture-data/culture_grpo_train.jsonl"
    preprocessing:
        max_seq_length: 512
        resolution: 512

optimizer:
    name: adam
    params:
        learning_rate: 3e-6   # paper: 3e-6 without KL, 5e-6 with KL

training:
    # Mask-GRPO (arXiv:2510.13418)
    group_size: 6                 # G rollouts per prompt
    generation_timesteps: 20      # rollout unmasking steps (paper reduction: 50 -> 20)
    grpo_loss_timesteps: 20       # compute loss on first k steps (computational reduction)
    kl_beta: 0.0                  # paper: removing KL helps small models
    candidate: 2                  # transition probability variant (1 or 2)
    clip_low: 0.9
    clip_high: 1.2
    max_grad_norm: 1.0
    max_train_steps: 300          # test run; steps are synchronized across ranks
    guidance_scale: 0             # rollouts and training use cfg=0
    generation_temperature: 1.0
    mask_schedule: "cosine"
    reward_type: "image_reward"   # "image_reward" | "clip"
    reward_model: "ImageReward-v1.0"
    # reward_download_root: set on the cluster (compute nodes have no internet)

    # LR schedule (reference Mask-GRPO: warmup + cosine; constant lr collapsed
    # the 1000-step run at 3e-6 / kl_beta 0)
    lr_scheduler: "cosine"
    lr_warmup_steps: 100

    # early stopping on held-out cultural prompts, evaluated at eval settings
    # holdout_prompts_file: set on the cluster (culture_grpo_eval.jsonl)
    holdout_eval_every: 50
    holdout_subset: 30            # 5 uuids x 6 languages (file is uuid-major)
    holdout_samples: 4
    early_stop_patience: 5
    seed: 42
    batch_size: 1
    cond_dropout_prob: 0.0

    # evaluation-time settings (use inference_t2i.py / benchmark scripts)
    eval_generation_timesteps: 50
    eval_guidance_scale: 5
